<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'" />

    <title>페이지를 찾을 수 없어요 | 모아온</title>
    <link rel="icon" href="https://site-url.invalid/favicon.ico?v=2" sizes="32x32" />
    <link rel="stylesheet" href="https://site-url.invalid/assets/css/main.css?v=21" />
    <style>
      .not-found { display: grid; place-items: center; align-content: center; gap: 6px; min-height: 60vh; text-align: center; }
      .not-found b { color: var(--blue); font-size: 64px; font-weight: 800; line-height: 1; letter-spacing: -2px; }
      .not-found h1 { margin: 8px 0 0; color: var(--navy); font-size: 24px; font-weight: 700; }
      .not-found p { margin: 0; color: var(--muted); font-size: 15px; }
    </style>
  </head>
  <body>
    <header>
      <nav class="wrap nav">
        <a class="brand-moa" href="https://site-url.invalid/"
          ><img class="moa-symbol" src="https://site-url.invalid/assets/moa-symbol.svg" alt="" width="40" height="40" /><span class="moa-word"
            ><b>모아온</b><small>COLLECT · COMPARE · CHOOSE</small></span
          ></a
        >
      </nav>
    </header>
    <main class="wrap not-found">
      <b>404</b>
      <h1>페이지를 찾을 수 없어요</h1>
      <p>주소가 바뀌었거나 없는 페이지예요.</p>
    </main>
  </body>
