<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>모아온 | 모바일 카드 시안</title>
    <link rel="icon" href="../favicon.ico" sizes="32x32" />
    <style>
      :root {
        --blue: #087df2;
        --navy: #17212b;
        --bg: #f4f7fb;
        --line: #e2e8f0;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #e9eef4;
        color: #1d2834;
        font-family: Arial, "Noto Sans KR", sans-serif;
        word-break: keep-all;
        overflow-wrap: anywhere;
      }
      main {
        width: min(1240px, calc(100% - 24px));
        margin: auto;
        padding: 32px 0 60px;
      }
      h1 {
        margin: 0 0 6px;
        color: var(--navy);
        font-size: 24px;
        font-weight: 900;
      }
      .lead {
        margin: 0 0 24px;
        color: #5d6876;
        font-size: 14px;
        line-height: 1.6;
      }
      .opts {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 375px), 1fr));
        gap: 22px;
        align-items: start;
      }
      .opt h2 {
        margin: 0 0 4px;
        color: var(--navy);
        font-size: 16px;
        font-weight: 800;
      }
      .opt > p {
        min-height: 66px;
        margin: 0 0 10px;
        color: #6b7684;
        font-size: 13px;
        line-height: 1.6;
      }
      /* phone frame at a 375px screen width */
      .phone {
        max-width: 375px;
        padding: 12px;
        border-radius: 22px;
        background: var(--bg);
        box-shadow: 0 0 0 8px #fff, 0 10px 30px #1c2c3d22;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      /* ---- shared mobile card ---- */
      .card {
        position: relative;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 13px;
        background: #fff;
      }
      .rank-flag {
        position: absolute;
        z-index: 2;
        top: 0;
        left: 5px;
        width: 30px;
        height: 40px;
        padding-top: 7px;
        color: #fff;
        text-align: center;
        font-size: 15px;
        font-weight: 900;
        clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 82%, 0 100%);
      }
      .card:nth-child(1) .rank-flag {
        background: var(--blue);
      }
      .card:nth-child(2) .rank-flag {
        background: var(--navy);
      }
      .card:nth-child(3) .rank-flag {
        background: #5d6b7c;
      }
      .card h3 {
        margin: 0;
        color: var(--navy);
        font-size: 15px;
        font-weight: 800;
      }
      .tags {
        display: flex;
        flex-wrap: wrap;
        gap: 4px;
      }
      .tags i {
        padding: 3px 7px;
        border-radius: 6px;
        background: #f1f4f8;
        color: #4a5868;
        font-size: 12px;
        font-style: normal;
        font-weight: 600;
      }
      .reason {
        color: #3d4856;
        font-size: 14px;
        line-height: 1.55;
      }
      .stars {
        color: #f5b301;
        font-size: 13px;
        letter-spacing: 1px;
      }
      .score {
        color: var(--navy);
        font-size: 15px;
        font-weight: 800;
      }
      .go {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 42px;
        border-radius: 7px;
        background: var(--navy);
        color: #fff;
        font-size: 13px;
        font-weight: 800;
        text-decoration: none;
      }
      .label {
        color: #8a96a5;
        font-size: 12px;
        font-weight: 700;
      }

      /* ---- now (option B as shipped) ---- */
      .now .card {
        display: grid;
        grid-template-columns: 105px minmax(0, 1fr);
      }
      .now .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 8px;
        border-right: 1px solid #edf0f3;
      }
      .now .logo img {
        width: 100%;
        height: 56px;
        object-fit: contain;
      }
      .now .body {
        padding: 14px 12px 12px;
      }
      .now .tags {
        margin: 6px 0 10px;
      }
      .now .row {
        display: grid;
        grid-template-columns: 58px 1fr auto;
        gap: 8px;
        align-items: start;
        padding: 8px 0;
        border-top: 1px solid #edf0f3;
      }
      .now .row.t {
        align-items: center;
        margin-bottom: 10px;
        border-bottom: 1px solid #edf0f3;
      }
      .now .label {
        font-size: 11px;
        white-space: nowrap;
      }
      .now .row .reason {
        grid-column: 2 / 4;
      }

      /* ---- A: no lines, soft logo tile ---- */
      .a .card {
        display: grid;
        grid-template-columns: 100px minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
      }
      .a .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: #f5f7fa;
      }
      .a .logo img {
        width: 84px;
        height: 48px;
        object-fit: contain;
        mix-blend-mode: multiply;
      }
      .a .body {
        display: flex;
        flex-direction: column;
        gap: 7px;
        padding-top: 2px;
      }
      .a .meta {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .a .go {
        margin-top: 3px;
      }

      /* ---- B: horizontal header, full-width text ---- */
      .b .card {
        padding: 0 14px 14px;
      }
      .b .head {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0 -14px 12px;
        padding: 10px 14px 10px 46px;
        background: #f8fafc;
      }
      .b .head img {
        width: 82px;
        height: 36px;
        object-fit: contain;
        mix-blend-mode: multiply;
      }
      .b .head .score {
        margin-left: auto;
        white-space: nowrap;
      }
      .b .tags {
        margin-bottom: 8px;
      }
      .b .reason {
        margin: 0 0 12px;
      }

      /* ---- C: compact, score next to the name ---- */
      .c .card {
        display: grid;
        grid-template-columns: 92px minmax(0, 1fr);
        gap: 12px;
        padding: 12px;
      }
      .c .logo {
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 10px;
        background: #f5f7fa;
      }
      .c .logo img {
        width: 78px;
        height: 44px;
        object-fit: contain;
        mix-blend-mode: multiply;
      }
      .c .body {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .c .name {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 8px;
      }
      .c .score-pill {
        flex: none;
        padding: 2px 7px;
        border-radius: 10px;
        background: #fff7e0;
        color: #8a5a00;
        font-size: 12px;
        font-weight: 800;
      }
      .c .reason {
        display: -webkit-box;
        overflow: hidden;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        font-size: 13px;
      }
      .c .go {
        min-height: 38px;
        margin-top: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>모바일 카드 시안</h1>
      <p class="lead">휴대폰 화면 폭(375px) 기준이에요. PC 카드는 지금 그대로 두고 모바일만 바꾸는 안이에요. 마음에 드는 알파벳을 골라 주세요.</p>
      <div class="opts" id="opts"></div>
    </main>
    <script>
      const OPTIONS = [
        ["now", "지금", "왼쪽 로고 칸과 가는 선들이 칸을 나눠 표처럼 보여요."],
        ["a", "A. 선 없애기", "선을 모두 빼고 로고는 연한 회색 타일에 담았어요. 라벨 없이 이름 → 태그 → 설명 → 별점 순으로 흘러요."],
        ["b", "B. 가로 헤더", "로고 칸을 없애고 로고·이름·점수를 맨 위 한 줄에 모았어요. 글이 카드 폭을 다 써서 줄 수가 줄어요."],
        ["c", "C. 압축형 (추천)", "점수를 이름 옆 작은 배지로 올리고 설명은 두 줄까지만 보여요. 카드가 가장 짧아 한 화면에 더 많이 보여요."],
      ];
      const chips = (s) => `<div class="tags">${s.tags.split(/\s+/).map((t) => `<i>${t}</i>`).join("")}</div>`;
      const go = `<a class="go" href="#" onclick="return false">사이트 바로가기 ›</a>`;
      const stars = `<span class="stars">★★★★★</span>`;
      const CARD = {
        now: (s) =>
          `<div class="logo"><img src="../${s.logo}" alt=""></div><div class="body"><h3>${s.name}</h3><div class="tags-wrap">${chips(s)}</div>` +
          `<div class="row"><span class="label">선정이유</span><span class="reason">${s.reason}</span></div>` +
          `<div class="row t"><span class="label">종합신뢰도</span>${stars}<span class="score">${s.score}/5</span></div>${go}</div>`,
        a: (s) =>
          `<div class="logo"><img src="../${s.logo}" alt=""></div><div class="body"><h3>${s.name}</h3>${chips(s)}` +
          `<div class="reason">${s.reason}</div><div class="meta">${stars}<span class="score">${s.score}</span></div>${go}</div>`,
        b: (s) =>
          `<div class="head"><img src="../${s.logo}" alt=""><h3>${s.name}</h3><span class="score">★ ${s.score}</span></div>` +
          `${chips(s)}<p class="reason">${s.reason}</p>${go}`,
        c: (s) =>
          `<div class="logo"><img src="../${s.logo}" alt=""></div><div class="body"><div class="name"><h3>${s.name}</h3><span class="score-pill">★ ${s.score}</span></div>` +
          `${chips(s)}<div class="reason">${s.reason}</div>${go}</div>`,
      };
      fetch("../data/webhards.json")
        .then((r) => r.json())
        .then(({ webhards }) => {
          const top = webhards.filter((s) => s.status === "ready").slice(0, 3);
          document.getElementById("opts").innerHTML = OPTIONS.map(([k, title, note]) =>
            `<div class="opt"><h2>${title}</h2><p>${note}</p><div class="phone ${k}"><div class="list">` +
            top.map((s, i) => `<article class="card"><span class="rank-flag">${i + 1}</span>${CARD[k](s)}</article>`).join("") +
            `</div></div></div>`).join("");
        });
    </script>
  </body>
</html>
