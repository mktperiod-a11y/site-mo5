name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 개인정보 규칙 검사
        env:
          PRIVACY_PATTERNS: ${{ secrets.PRIVACY_PATTERNS }}
        run: python3 .github/scripts/privacy_check.py files

      - id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          GOOGLE_SITE_VERIFICATION: ${{ secrets.GOOGLE_SITE_VERIFICATION }}
        run: |
          set -euo pipefail
          BASE_URL="${BASE_URL%/}"
          case "$BASE_URL" in
            https://*) ;;
            *) echo "::error::Pages base_url을 가져오지 못해 배포를 멈춥니다."; exit 1 ;;
          esac

          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/README.md _site/CLAUDE.md

          grep -rlZ 'https://site-url\.invalid' _site \
            | xargs -0 -r sed -i "s|https://site-url\.invalid|${BASE_URL}|g"

          if grep -rl 'site-url\.invalid' _site; then
            echo "::error::자리표시 주소가 남아 있어 배포를 멈춥니다."
            exit 1
          fi

          # Search Console 확인 토큰은 저장소에 두지 않고 배포 결과물에만 넣는다.
          if [ -n "$GOOGLE_SITE_VERIFICATION" ]; then
            case "$GOOGLE_SITE_VERIFICATION" in
              *[!A-Za-z0-9_-]*)
                echo "::error::GOOGLE_SITE_VERIFICATION 값 형식이 올바르지 않아 배포를 멈춥니다."
                exit 1 ;;
            esac
            sed -i "0,/<\/head>/s||  <meta name=\"google-site-verification\" content=\"${GOOGLE_SITE_VERIFICATION}\" />\n  </head>|" _site/index.html
            grep -q 'name="google-site-verification"' _site/index.html
          else
            echo "::warning::GOOGLE_SITE_VERIFICATION 값이 없어 Search Console 확인 태그를 넣지 않습니다."
          fi

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/deploy-pages@v4
