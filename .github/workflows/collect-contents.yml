name: Collect contents

# Tuesday 09:07 KST: last week's box office and TV ratings are published by then (Monday is too early).
# Commits data/contents.json, then starts a deploy (a push made with the workflow token starts no workflows).
on:
  schedule:
    - cron: "7 0 * * 2"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: 콘텐츠 순위 수집
        run: python3 .github/scripts/collect_contents.py

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contents.json
          if ! git diff --cached --quiet; then
            git commit -m "Weekly contents $(date -u +%F)"
            git push
          fi

      - name: 배포 시작
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
